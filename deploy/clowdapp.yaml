apiVersion: v1
kind: Template
metadata:
  name: engine
objects:
- apiVersion: cloud.redhat.com/v1alpha1
  kind: ClowdApp
  metadata:
    name: engine
  spec:
    envName: ${ENV_NAME}
    testing:
      iqePlugin: advisor
    optionalDependencies:
      - ingress
      - puptoo
      - host-inventory
      - advisor-backend
      - playbook-dispatcher
      - sources-api
    deployments:
      - name: processor
        minReplicas: ${{MIN_REPLICAS}}
        podSpec:
          args:
            - /var/config.yaml
          command:
            - insights-core-engine
          image: ${IMAGE}:${IMAGE_TAG}
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /metrics
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 187
            successThreshold: 1
            timeoutSeconds: 35
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /metrics
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 67
            successThreshold: 1
            timeoutSeconds: 35
          env:
            - name: CLOWDER_ENABLED
              value: ${CLOWDER_ENABLED}
            - name: EVENTS_TOPIC
              value: ${EVENTS_TOPIC}
            - name: OTEL_ENABLED
              value: ${OTEL_ENABLED}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            - name: OTEL_SAMPLING_RATE
              value: ${OTEL_SAMPLING_RATE}
            - name: OTEL_MQ_ENABLED
              value: ${OTEL_MQ_ENABLED}
            - name: OTEL_HTTP_OUTBOUND_ENABLED
              value: ${OTEL_HTTP_OUTBOUND_ENABLED}
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              value: ${OTEL_EXPORTER_OTLP_COMPRESSION}
            - name: OTEL_BSP_MAX_QUEUE_SIZE
              value: ${OTEL_BSP_MAX_QUEUE_SIZE}
            - name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
              value: ${OTEL_BSP_MAX_EXPORT_BATCH_SIZE}
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: ${OTEL_BSP_SCHEDULE_DELAY}
            - name: OTEL_BSP_EXPORT_TIMEOUT
              value: ${OTEL_BSP_EXPORT_TIMEOUT}
            - name: OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT
              value: ${OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT}
            - name: OTEL_SPAN_ATTRIBUTE_VALUE_LENGTH_LIMIT
              value: ${OTEL_SPAN_ATTRIBUTE_VALUE_LENGTH_LIMIT}
            - name: IMAGE_TAG
              value: ${IMAGE_TAG}
          resources:
            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}
            requests:
              cpu: 600m
              memory: 768Mi
          volumeMounts:
          - mountPath: /var
            name: insights-engine
          volumes:
          - configMap:
              defaultMode: 420
              name: insights-engine
            name: insights-engine
    inMemoryDb: true
    kafkaTopics:
      - replicas: 5
        partitions: 5
        topicName: ${EVENTS_TOPIC}
      - replicas: 5
        partitions: 5
        topicName: platform.engine.results
      - replicas: 5
        partitions: 5
        topicName: platform.payload-status
- apiVersion: v1
  data:
    config.yaml: |+
      plugins:
          default_component_enabled: true
          packages:
              - insights.specs.default
              - insights.specs.insights_archive
              - telemetry.rules
              - prodsec.rules
              - insights_kafka_service.rules
      configs: []
      service:
          extract_timeout: 10
          unpacked_archive_size_limit: 1800000000
          extract_tmp_dir:
          format: insights_kafka_service.formats._insights.InsightsFormat
          target_components: []
          consumer:
            name: "insights_kafka_service.consumer.InsightsKafkaConsumer"
            kwargs:
              services:
                - "advisor"
              group_id: "insights-core-kafka"
              queued.max.messages.kbytes: 10000
              session.timeout.ms: 30000
              max.poll.interval.ms: 600000
          publisher:
            name: "insights_kafka_service.producer.InsightsKafkaProducer"
          downloader:
            name: "insights_messaging.downloaders.httpfs.Http"
          redis:
            decode_responses: true
          logging_configurator:
            name: insights_kafka_service.log_configurator.configure_logging
          logging:
            version: 1
            disable_existing_loggers: false
            formatters:
              logstash:
                (): logstash_formatter.LogstashFormatterV1
            handlers:
              console:
                class: logging.StreamHandler
                formatter: logstash
                stream: ext://sys.stdout
            root:
                level: INFO
                handlers: [console]
            loggers:
              insights.core.dr:
                level: ${INSIGHTS_CORE_LOG_LEVEL}
              insights.core.plugins:
                level: ${INSIGHTS_CORE_LOG_LEVEL}
              insights_messaging:
                level: ${ENGINE_LOG_LEVEL}
              insights_kafka_service:
                level: ${ENGINE_LOG_LEVEL}
              kafka:
                level: ${KAFKA_LOG_LEVEL}
              "":
                handlers:
                  - console
                level: ${DEFAULT_LOG_LEVEL}
          watchers:
            - name: "insights_kafka_service.metrics.Watcher"
            - name: "insights_kafka_service.metrics.Engine"
            - name: "insights_kafka_service.tracker.Watcher"
              kwargs:
                service_name: "insights-engine"
            - name: "insights_kafka_service.tracing.Watcher"
            - name: "insights_kafka_service.tracing.Engine"
  kind: ConfigMap
  metadata:
    name: insights-engine
  annotations:
    qontract.recycle: "true"
parameters:
- description: Topic to consume events from.
  name: EVENTS_TOPIC
  value: platform.inventory.events
- description: The log group to use for cloudwatch logging
  name: CLOUD_WATCH_LOG_GROUP
  value: platform-dev
- description: Cpu limit of service
  name: CPU_LIMIT
  value: '2'
- description: memory limit of service
  name: MEMORY_LIMIT
  value: 1Gi
- name: DEFAULT_LOG_LEVEL
  value: INFO
- name: ENGINE_LOG_LEVEL
  value: INFO
- name: KAFKA_LOG_LEVEL
  value: ERROR
- name: INSIGHTS_CORE_LOG_LEVEL
  value: ERROR
- description: Image tag
  name: IMAGE_TAG
  required: true
- description: Image name
  name: IMAGE
  value: quay.io/redhat-services-prod/insights-management-tenant/insights-engine/engine
  # value: quay.io/cloudservices/insights-engine
- description: Configured amount of replicas
  name: MIN_REPLICAS
  value: "1"
- description: Determines Clowder deployment
  name: CLOWDER_ENABLED
  value: "false"
- description: ClowdEnv Name
  name: ENV_NAME
  required: false
- description: Enable OpenTelemetry distributed tracing
  name: OTEL_ENABLED
  value: "false"
- description: OTLP exporter endpoint URL
  name: OTEL_EXPORTER_OTLP_ENDPOINT
  value: ""
- description: Trace sampling rate (0.0 to 1.0)
  name: OTEL_SAMPLING_RATE
  value: "1.0"
- description: Enable Kafka messaging instrumentation
  name: OTEL_MQ_ENABLED
  value: "true"
- description: Enable outbound HTTP instrumentation
  name: OTEL_HTTP_OUTBOUND_ENABLED
  value: "true"
- description: OTLP exporter compression (gzip, deflate, none)
  name: OTEL_EXPORTER_OTLP_COMPRESSION
  value: "gzip"
- description: BatchSpanProcessor max queue size
  name: OTEL_BSP_MAX_QUEUE_SIZE
  value: "8192"
- description: BatchSpanProcessor max export batch size
  name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
  value: "256"
- description: BatchSpanProcessor schedule delay in milliseconds
  name: OTEL_BSP_SCHEDULE_DELAY
  value: "2000"
- description: BatchSpanProcessor export timeout in milliseconds
  name: OTEL_BSP_EXPORT_TIMEOUT
  value: "10000"
- description: Max number of attributes per span
  name: OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT
  value: "64"
- description: Max length of span attribute values
  name: OTEL_SPAN_ATTRIBUTE_VALUE_LENGTH_LIMIT
  value: "1024"
